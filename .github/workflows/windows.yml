name: Windows tests and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r src/requirements.txt
      - name: Fetch and verify bridge and corresponding source
        run: python scripts/fetch_bridge.py
      - name: Test without keyboard access
        run: python -m unittest discover -s src -v
      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build 'src/Prism Keyboard Studio.spec'
      - name: Verify packaged UI and speed controls
        shell: pwsh
        run: |
          $executable = Join-Path $PWD 'dist/Prism Keyboard Studio/Prism Keyboard Studio.exe'
          foreach ($scale in @('1', '1.5')) {
            $env:QT_SCALE_FACTOR = $scale
            $report = Join-Path $PWD "build/checks/resize-$scale/report.json"
            $process = Start-Process -FilePath $executable -ArgumentList @('--check-resize', ('"' + $report + '"')) -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Resize check failed at scale $scale" }
          }
          $env:QT_SCALE_FACTOR = '1'
          $report = Join-Path $PWD 'build/checks/speed/report.json'
          $process = Start-Process -FilePath $executable -ArgumentList @('--check-speed', ('"' + $report + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Speed check failed' }
      - name: Assemble portable ZIP
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Prism-Keyboard-Studio-Windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
